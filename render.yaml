services:
  - type: web
    name: ai-manju-nlp-demo
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python start_cloud.py
    healthCheckPath: /_stcore/health
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
